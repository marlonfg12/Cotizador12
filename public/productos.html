<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos | Depósito de Flejes San Martín</title>
  <link rel="stylesheet" href="/css/normalize.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <div class="app">
    <aside class="app__sidebar" id="sidebar">
      <h1 class="app__marca">Depósito de Flejes San Martín</h1>
      <p class="app__marca-sub">Panel de ventas</p>
      <nav class="app__nav" aria-label="Menú principal">
        <a class="app__nav-link app__nav-link--destacado" href="/cotizacion.html">+ Nueva cotización</a>
        <a class="app__nav-link" href="/dashboard.html">Panel de ventas</a>
        <a class="app__nav-link" href="/clientes.html">Clientes</a>
        <a class="app__nav-link is-activo" href="/productos.html">Productos</a>
        <a class="app__nav-link" href="/descuentos.html">Descuentos</a>
        <a class="app__nav-link" href="/configuracion.html">Configuración</a>
      </nav>
      <div class="app__sidebar-pie">
        <a class="app__nav-link" href="/index.html">Salir</a>
      </div>
    </aside>

    <div class="app__main">
      <button class="btn btn--secundario btn--pequeño app__menu-toggle" type="button" id="btnMenu">Menú</button>

      <header class="app__cabecera">
        <div>
          <p class="app__eyebrow">INVENTARIO</p>
          <h2 class="app__titulo">Productos</h2>
          <p class="app__subtitulo">Registre materiales frecuentes. En la cotización también puede escribir productos a mano.</p>
        </div>
        <button class="btn btn--primario" type="button" id="btnNuevo">+ Nuevo producto</button>
      </header>

      <div id="mensaje" hidden></div>

      <div class="toolbar">
        <input class="formulario__campo toolbar__busqueda" type="search" id="buscar" placeholder="Buscar producto..." />
      </div>

      <section class="listado__grid" id="lista"></section>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal__caja">
      <h3 class="modal__titulo" id="modalTitulo">Nuevo producto</h3>
      <div id="modalMensajeProducto" class="alerta alerta--error" hidden></div>
      <form id="formProducto">
        <input type="hidden" id="productoId" />
        <div class="formulario__grupo">
          <label class="formulario__etiqueta" for="nombre">Nombre del producto *</label>
          <input class="formulario__campo" id="nombre" required placeholder="Ej. Fleje de acero 1 pulgada" />
        </div>
        <div class="formulario__grupo">
          <label class="formulario__etiqueta" for="descripcion">Descripción</label>
          <textarea class="formulario__area" id="descripcion" placeholder="Detalles opcionales"></textarea>
        </div>
        <div class="formulario__grupo">
          <label class="formulario__etiqueta" for="precio">Precio unitario ($) *</label>
          <input class="formulario__campo" type="number" id="precio" min="0.01" step="0.01" required placeholder="Ej. 5000" />
          <input type="hidden" id="unidad" value="pza" />
        </div>
        <div class="formulario__fila formulario__fila--2">
          <div class="formulario__grupo">
            <label class="formulario__etiqueta" for="stockActual">Stock actual</label>
            <input class="formulario__campo" type="number" min="0" step="0.01" id="stockActual" value="0" />
          </div>
          <div class="formulario__grupo">
            <label class="formulario__etiqueta" for="stockMinimo">Alerta cuando quede en</label>
            <input class="formulario__campo" type="number" min="0" step="0.01" id="stockMinimo" value="0" />
          </div>
        </div>
        <div class="modal__acciones">
          <button class="btn btn--secundario" type="button" id="btnCerrarModal">Cancelar</button>
          <button class="btn btn--primario" type="submit">Guardar producto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/productos.js"></script>
</body>
</html>
